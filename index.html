.tab-btn.active{background:var(--accent);color:#fff}.tab-btn:not(.active){background:transparent;color:var(--muted)}.tab-btn:not(.active):hover{background:#EDF5ED}

.wo-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.bar-track{height:7px;background:#E8EDE5;border-radius:3px;overflow:hidden}.bar-fill{height:100%;border-radius:3px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.header-bar{background:var(--green-dark);color:#fff;margin:-22px -26px 22px;padding:18px 26px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.header-bar h1{font-size:24px;font-weight:800;font-family:'Space Grotesk',sans-serif;letter-spacing:-0.5px;color:#fff}
.header-bar .sub{font-size:12px;color:#B8D4B0;margin-top:3px}.header-bar .date{font-size:11px;color:#B8D4B0;text-align:right;font-family:'JetBrains Mono',monospace}.header-bar .date strong{color:#fff;display:block;font-weight:600}

.accent-stripe{height:4px;background:linear-gradient(90deg,var(--green-dark),var(--green-mid),var(--yellow));margin:-22px -26px 22px}
.accordion{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.accordion-head{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background 0.15s;user-select:none}

function statHTML(l,v,sub,ac,ic,delta){let dH='';if(delta!==undefined&&delta!==null){const up=delta>0;const flat=delta===0;const arrow=flat?'→':up?'▲':'▼';const dC=flat?'var(--muted)':up?'#B91C1C':'#1B6B2A';const lb=flat?'No change':up?`+${delta} from prior wk`:`${delta} from prior wk`;dH=`<div style="display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:3px 8px;border-radius:4px;background:${flat?'#E8EDE5':up?'rgba(185,28,28,0.08)':'rgba(27,107,42,0.08)'};font-size:10px;font-weight:700;color:${dC};font-family:'JetBrains Mono',monospace">${arrow} ${lb}</div>`}return`<div class="stat"><div class="icon" style="color:${ac}">${esc(ic)}</div><div class="label">${esc(l)}</div><div class="value" style="color:${ac}">${esc(String(v))}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}${dH}</div>`}
function sevBadge(d){const s=SEV(d);return`<span class="sev-badge" style="color:${s.c};background:${s.bg};border:1px solid ${s.c}22">${s.l}</span>`}
function woBadge(r){return r.hasOpenWO?`<span class="wo-badge" style="color:#1B6B2A"><span class="wo-dot" style="background:#1B6B2A"></span>${r.openWO}</span>`:`<span class="wo-badge" style="color:#B91C1C"><span class="wo-dot" style="background:#B91C1C"></span>NO WO</span>`}
function miniBar(items){return`<div style="display:flex;gap:1px;align-items:flex-end;height:28px">${items.map(it=>{const hh=Math.max(3,(it.overdue/MAXOV)*26);const s=SEV(it.overdue);return`<div title="${it.asset}: ${it.overdue}d" style="width:5px;height:${hh}px;background:${s.c};border-radius:1.5px;opacity:0.75"></div>`}).join('')}</div>`}
function dot(color,sz=7){return`<span style="width:${sz}px;height:${sz}px;border-radius:2px;background:${color};display:inline-block"></span>`}
function filterData(){let d=DATA;if(state.search)d=d.filter(r=>r.asset.includes(state.search)||r.store.toLowerCase().includes(state.search.toLowerCase()));return[...d].sort((a,b)=>{const av=a[state.sortCol],bv=b[state.sortCol];if(typeof av==="string")return state.sortDir==="desc"?bv.localeCompare(av):av.localeCompare(bv);return state.sortDir==="desc"?bv-av:av-bv})}
function thH(l,col,w,sortable=true){const ac=state.sortCol===col;const ar=ac?(state.sortDir==="desc"?" ↓":" ↑"):"";return`<th class="${sortable?'sortable':''} ${ac?'active':''}" style="width:${w}px" ${sortable?`onclick="handleSort('${col}')"`:''}>${esc(l)}${ar}</th>`}
function assetTableHTML(data){let hd=thH("Asset","asset",80)+thH("Class","cls",80)+thH("Type","type",130)+thH("Store","store",150)+thH("Last PM","lastDate",85)+thH("Days Since","daysSince",75)+`<th style="width:55px">INTV</th>`+thH("Overdue","overdue",75)+`<th style="width:75px">SEV</th><th style="width:90px">OPEN WO</th><th style="width:90px">SPAN</th>`;const rows=data.map((r,i)=>{const s=SEV(r.overdue);const bw=Math.max(3,(r.overdue/MAXOV)*100);return`<tr style="background:${i%2===0?'transparent':'#F9FAF7'}"><td class="mono" style="font-weight:600;font-size:12px">${esc(r.asset)}</td><td><span style="display:inline-flex;align-items:center;gap:4px">${dot(CC[r.cls]||'#666',6)} ${esc(r.cls)}</span></td><td style="color:var(--muted)">${esc(r.type)}</td><td>${esc(r.store)}</td><td class="mono">${esc(r.lastDate||'')}</td><td class="mono">${r.daysSince}</td><td class="mono" style="color:var(--muted)">${r.interval}d</td><td class="mono" style="font-weight:700;color:${s.c}">${r.overdue}</td><td>${sevBadge(r.overdue)}</td><td>${woBadge(r)}</td><td><div class="bar-track"><div class="bar-fill" style="width:${bw}%;background:${s.c}"></div></div></td></tr>`}).join('');return`<div style="overflow-x:auto"><table><thead><tr>${hd}</tr></thead><tbody>${rows}</tbody></table></div>`}
function renderSummary(){const crit=DATA.filter(r=>r.overdue>90).length;const noWO=DATA.filter(r=>!r.hasOpenWO).length;const avg=Math.round(DATA.reduce((s,r)=>s+r.overdue,0)/DATA.length);const sevB={Critical:0,High:0,Medium:0,Low:0};DATA.forEach(r=>{sevB[SEV(r.overdue).l]++});const regions=getRegions();let o=`<div class="kpi-strip">${statHTML("Total Overdue",DATA.length,`${(DATA.length/TOTAL_FLEET*100).toFixed(1)}% of fleet`,"#1B6B2A","Σ",DATA.length-PRIOR.total)}${statHTML("Critical (>90d)",crit,`${Math.round(crit/DATA.length*100)}% of overdue`,"#B91C1C","!",crit-PRIOR.crit)}${statHTML("No Open WO",noWO,"Needs WO created","#D4A017","⚠",noWO-PRIOR.noWO)}${statHTML("Avg Days Overdue",avg,`Worst: ${MAXOV} days`,"#C2410C","μ",avg-PRIOR.avg)}</div>`;const sc=[{l:"Critical",c:"#B91C1C"},{l:"High",c:"#C2410C"},{l:"Medium",c:"#B45309"},{l:"Low",c:"#1B6B2A"}];let sb=sc.map(s=>{const p=(sevB[s.l]/DATA.length)*100;return p>0?`<div style="width:${p}%;background:${s.c};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;font-family:'JetBrains Mono',monospace" title="${s.l}: ${sevB[s.l]}">${p>8?sevB[s.l]:''}</div>`:''}).join('');let sl=sc.map(s=>`<span style="font-size:10px;color:var(--muted);display:inline-flex;align-items:center;gap:4px">${dot(s.c,8)} ${s.l}: ${sevB[s.l]}</span>`).join('');o+=`<div class="card"><div class="grotesk" style="font-size:12px;font-weight:700;margin-bottom:12px">Severity Distribution</div><div style="display:flex;border-radius:6px;overflow:hidden;height:28px">${sb}</div><div style="display:flex;gap:16px;margin-top:8px">${sl}</div></div>`;const cls=["Truck","Trailer","TMFL","LD Vehicle","Forklift"];let cc=cls.map(c=>{const it=DATA.filter(r=>r.cls===c).sort((a,b)=>b.overdue-a.overdue);if(!it.length)return'';const fl=FLEET[c]||0;const pc=fl?((it.length/fl)*100).toFixed(1):it.length;const ca=Math.round(it.reduce((s,r)=>s+r.overdue,0)/it.length);const cr=it.filter(r=>r.overdue>90).length;return`<div style="background:var(--bg);border-radius:8px;padding:12px 14px;border:1px solid var(--border);border-left:3px solid ${CC[c]}"><div class="flex-between" style="margin-bottom:3px"><span style="font-size:12px;font-weight:700;color:${CC[c]}">${esc(c)}</span><span class="mono" style="font-size:18px;font-weight:800">${fl?pc+'%':pc}</span></div><div class="mono" style="font-size:10px;color:var(--muted);margin-bottom:6px">${it.length} overdue${fl?' of '+fl:''}</div>${miniBar(it)}<div class="flex-between" style="margin-top:6px;font-size:10px;color:var(--muted)"><span>Avg: ${ca}d</span>${cr>0?`<span style="color:#B91C1C;font-weight:600">${cr} critical</span>`:''}</div></div>`}).join('');o+=`<div class="card"><div class="grotesk" style="font-size:12px;font-weight:700;margin-bottom:12px">Overdue by Asset Class</div><div class="grid grid-sm">${cc}</div></div>`;let rc=regions.map(r=>`<div class="region-card" style="border-color:var(--border);border-left-color:${RC[r.name]||'#666'}" onclick="state.tab='regions';state.openRegions={'${r.name}':true};render()"><div class="flex-between" style="margin-bottom:3px"><span style="font-size:12px;font-weight:700;color:${RC[r.name]||'#333'}">${esc(r.name)}</span><span class="mono" style="font-size:18px;font-weight:800">${r.count}</span></div>${miniBar(r.items)}<div class="flex-between" style="margin-top:6px;font-size:10px;color:var(--muted)"><span>Avg: ${r.avg}d</span>${r.noWO>0?`<span style="color:#D4A017;font-weight:600">${r.noWO} no WO</span>`:''}${r.crit>0?`<span style="color:#B91C1C;font-weight:600">${r.crit} crit</span>`:''}</div></div>`).join('');o+=`<div class="card"><div class="grotesk" style="font-size:12px;font-weight:700;margin-bottom:12px">Overdue by Region</div><div class="grid">${rc}</div></div>`;o+=`<div class="card"><div class="flex-between" style="margin-bottom:14px;flex-wrap:wrap;gap:8px"><span class="grotesk" style="font-size:12px;font-weight:700">All Overdue Assets</span><input class="search-input" type="text" placeholder="Search asset # or store..." value="${esc(state.search)}" oninput="state.search=this.value;render()"></div>${assetTableHTML(filterData())}<div class="flex-between" style="margin-top:12px;padding:8px 0;border-top:1px solid var(--border);font-size:11px;color:var(--muted)"><span>Showing ${filterData().length} of ${DATA.length} assets</span><span class="mono">Critical: &gt;90d · High: 61-90d · Medium: 31-60d · Low: 1-30d</span></div></div>`;return o}
function toggleRegion(name){state.openRegions[name]=!state.openRegions[name];render()}
function toggleStore(rn,sn){const key=rn+'|'+sn;state.openStores[key]=!state.openStores[key];render()}
function renderRegions(){const regions=getRegions();const nw=DATA.filter(r=>!r.hasOpenWO).length;const avg=Math.round(DATA.reduce((s,r)=>s+r.overdue,0)/DATA.length);let o=`<div class="kpi-strip">${statHTML("Total Overdue",DATA.length,`${(DATA.length/TOTAL_FLEET*100).toFixed(1)}% of fleet`,"#1B6B2A","Σ")}${statHTML("Regions",regions.length,"With overdue assets","#14522A","◆")}${statHTML("No Open WO",nw,"Needs WO created","#D4A017","⚠")}${statHTML("Avg Overdue",avg,`Worst: ${MAXOV}d`,"#C2410C","μ")}</div>`;regions.forEach(r=>{const isOpen=!!state.openRegions[r.name];const stores=getStoresForRegion(r.name);let storeContent='';if(isOpen){stores.forEach(s=>{const sk=r.name+'|'+s.name;const sOpen=!!state.openStores[sk];const statsRow=`<span class="mono" style="font-size:11px;display:flex;gap:12px;align-items:center"><span style="font-weight:700">${s.count} asset${s.count>1?'s':''}</span><span style="color:var(--muted)">Avg: ${s.avg}d</span>${s.crit>0?`<span style="color:#B91C1C;font-weight:600">${s.crit} crit</span>`:''}${s.noWO>0?`<span style="color:#D4A017;font-weight:600">${s.noWO} no WO</span>`:''}</span>`;storeContent+=`<div class="store-row" onclick="event.stopPropagation();toggleStore('${r.name}','${s.name.replace(/'/g,"\\'")}')"><div style="display:flex;align-items:center;gap:8px"><span class="accordion-arrow ${sOpen?'open':''}">▾</span><span style="font-weight:600;font-size:12px">${esc(s.name)}</span></div>${statsRow}</div>`;if(sOpen){storeContent+=`<div class="store-assets">${assetTableHTML(s.items)}</div>`}})}const regionStats=`<span class="mono" style="font-size:11px;display:flex;gap:14px;align-items:center"><span style="font-weight:800;font-size:16px">${r.count}</span><span style="color:var(--muted)">Avg: ${r.avg}d</span>${r.crit>0?`<span style="color:#B91C1C;font-weight:600">${r.crit} crit</span>`:''}${r.noWO>0?`<span style="color:#D4A017;font-weight:600">${r.noWO} no WO</span>`:''}<span style="color:var(--muted)">${stores.length} store${stores.length>1?'s':''}</span><button class="btn-download" style="padding:4px 10px;font-size:10px" onclick="event.stopPropagation();goToEmailForRegion('${r.name.replace(/'/g,"\\'")}')">✉ Draft Email</button></span>`;o+=`<div class="accordion"><div class="accordion-head" onclick="toggleRegion('${r.name}')"><div style="display:flex;align-items:center;gap:10px"><span class="accordion-arrow ${isOpen?'open':''}">▾</span>${dot(RC[r.name]||'#666',10)}<span class="grotesk" style="font-size:14px;font-weight:700;color:${RC[r.name]||'var(--fg)'}">${esc(r.name)}</span></div>${regionStats}</div>${isOpen?`<div class="accordion-body">${storeContent}</div>`:''}</div>`});return o}
function assetLabel(r){return `${r.store} — Asset ${r.asset} (${r.cls}, ${r.type})`}
function generateEmail(regionName){
  const items=DATA.filter(r=>r.region===regionName).sort((a,b)=>b.overdue-a.overdue);
  const critical=items.filter(r=>r.overdue>90);
  const other=items.filter(r=>r.overdue<=90);
  const noWO=items.filter(r=>!r.hasOpenWO);
  const dateStr=new Date().toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'});
  const lines=[];
  lines.push(`${regionName} Team,`);
  lines.push(``);
  lines.push(`Below is the current PM compliance status for fleet assets in ${regionName} as of ${dateStr}. Please review and take action to bring these assets current on preventive maintenance, acting immediately and scheduling service with your vendor is the most effective way to prevent minor issues from developing into long-term unit downtime.`);
  lines.push(``);

  lines.push(`CRITICAL — OVER 90 DAYS OVERDUE (${critical.length})`);
  lines.push(`-`.repeat(45));
  if(critical.length){
    critical.forEach(r=>{
      lines.push(`- ${assetLabel(r)} — ${r.overdue}d overdue (last PM ${r.lastDate}) — ${r.hasOpenWO?'WO '+r.openWO:'NO WO ON FILE'}`);
    });
  } else {
    lines.push(`No critical assets (>90 days overdue) in this region. Nice work!`);
  }
  lines.push(``);

  lines.push(`OTHER OVERDUE ASSETS (${other.length})`);
  lines.push(`-`.repeat(45));
  if(other.length){
    other.forEach(r=>{
      lines.push(`- ${assetLabel(r)} — ${r.overdue}d overdue (last PM ${r.lastDate}) — ${r.hasOpenWO?'WO '+r.openWO:'NO WO ON FILE'}`);
    });
  } else {
    lines.push(`No other overdue assets in this region.`);
  }
  lines.push(``);

  lines.push(`ASSETS WITHOUT AN OPEN WORK ORDER — PLEASE CREATE (${noWO.length})`);
  lines.push(`-`.repeat(45));
  if(noWO.length){
    noWO.forEach(r=>{
      lines.push(`- ${assetLabel(r)} — ${r.overdue}d overdue, no WO on file`);
    });
  } else {
    lines.push(`All overdue assets in this region have an open work order.`);
  }
  lines.push(``);
  lines.push(`If you have questions about any of the assets listed above, please reach out to the Fleet Department.`);
  lines.push(``);
  lines.push(`Thank you,`);
  lines.push(`Fleet Department`);

  const subject=`Fleet PM Compliance — Action Needed — ${regionName} — ${dateStr}`;
  const body=lines.join('\n');
  return{subject,body,items,critical,other,noWO};
}
async function copyToClipboard(text,label){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(err){}
    document.body.removeChild(ta);
  }
  state.copyMsg=`${label} copied to clipboard`;
  render();
  setTimeout(()=>{state.copyMsg="";render();},2200);
}
function copyEmailSubject(){const {subject}=generateEmail(state.emailRegion);copyToClipboard(subject,'Subject')}
function copyEmailBody(){const {body}=generateEmail(state.emailRegion);copyToClipboard(body,'Email body')}
function copyEmailAll(){const {subject,body}=generateEmail(state.emailRegion);copyToClipboard(`Subject: ${subject}\n\n${body}`,'Subject + body')}
function setEmailRegion(name){state.emailRegion=name;render()}
function goToEmailForRegion(name){state.tab='emails';state.emailRegion=name;render()}
function renderEmails(){
  const regions=REGION_ORDER.filter(r=>DATA.some(d=>d.region===r));
  if(!regions.length)return `<div class="card"><div class="empty-state"><div class="big">✓</div>No overdue assets to report on.</div></div>`;
  if(!regions.includes(state.emailRegion))state.emailRegion=regions[0];
  const {subject,body,items,critical,noWO}=generateEmail(state.emailRegion);
  let o=`<div class="card">
    <div class="grotesk" style="font-size:13px;font-weight:700;margin-bottom:12px">Generate Regional Manager Email</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:4px">
      <div>
        <div class="mono" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">Region</div>
        <select class="store-select" style="width:220px" onchange="setEmailRegion(this.value)">
          ${regions.map(r=>`<option value="${esc(r)}" ${state.emailRegion===r?'selected':''}>${esc(r)}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-download" onclick="copyEmailAll()">⬇ Copy Subject + Body</button>
        <button class="btn-download" onclick="copyEmailSubject()">Copy Subject</button>
        <button class="btn-download" onclick="copyEmailBody()">Copy Body</button>
      </div>
      ${state.copyMsg?`<span class="mono" style="font-size:11px;color:var(--accent);font-weight:700">✓ ${esc(state.copyMsg)}</span>`:''}
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px">${items.length} overdue asset${items.length!==1?'s':''} in ${esc(state.emailRegion)} · ${critical.length} critical (&gt;90d) · ${noWO.length} without an open WO</div>
  </div>`;

  o+=`<div class="card">
    <div class="mono" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Subject</div>
    <div class="mono" style="font-size:13px;font-weight:700;margin-bottom:16px;padding:10px 12px;background:var(--bg);border-radius:6px;border:1px solid var(--border)">${esc(subject)}</div>
    <div class="mono" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Body — ready to paste into Outlook</div>
    <pre style="white-space:pre-wrap;word-break:break-word;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:16px;margin:0;max-height:520px;overflow-y:auto">${esc(body)}</pre>
  </div>`;
  return o;
}
function handleSort(col){if(state.sortCol===col)state.sortDir=state.sortDir==="desc"?"asc":"desc";else{state.sortCol=col;state.sortDir="desc"}render()}
function switchTab(tab){state.tab=tab;state.search="";state.sortCol="overdue";state.sortDir="desc";if(tab!=="regions"){state.openRegions={};state.openStores={}}render()}
function render(){const now=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});const tabs=[{id:"summary",l:"Summary"},{id:"regions",l:"Region / Store"},{id:"emails",l:"Email Drafts"}];let tb=tabs.map(t=>`<button class="tab-btn ${state.tab===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.l}</button>`).join('');let content=state.tab==="summary"?renderSummary():state.tab==="regions"?renderRegions():renderEmails();document.getElementById('app').innerHTML=`<div class="header-bar"><div><div style="display:flex;align-items:center;gap:10px;margin-bottom:4px"><span class="live-dot"></span><span class="mono" style="font-size:11px;color:var(--yellow);font-weight:700;letter-spacing:1.5px;text-transform:uppercase">OVERDUE ASSETS — LIVE</span></div><h1>PM Compliance Dashboard</h1><p class="sub">McCoy's Building Supply · Fleet Preventive Maintenance · ${DATA.length} overdue of ${TOTAL_FLEET.toLocaleString()} assets (${(DATA.length/TOTAL_FLEET*100).toFixed(1)}%)</p></div><div class="date"><div>Report generated</div><strong>${now}</strong></div></div><div class="accent-stripe"></div><div class="tab-bar">${tb}</div>${content}`}
render();
</script>
